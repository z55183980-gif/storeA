worker_processes 1;
events { worker_connections 1024; }
http {
    include E:/storeA/packages/nginx-1.30.4/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server {
        listen 8080;
        server_name localhost;
        root E:/storeA/public;
        index index.html;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include E:/storeA/packages/nginx-1.30.4/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
        }
        location ~ /\. { deny all; }
    }
}
